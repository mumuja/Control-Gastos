<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Gastos</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2344/2344132.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-20">

  <!-- PANTALLA DE LOGIN -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm shadow-xl">
      <h1 class="text-2xl font-bold text-emerald-400 mb-1">Mis Finanzas</h1>
      <p class="text-slate-400 text-sm mb-6">Inicia sesión para sincronizar tus datos</p>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Correo electrónico</label>
          <input type="email" id="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Contraseña</label>
          <input type="password" id="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <p id="auth-error" class="text-rose-400 text-xs hidden"></p>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition">Entrar</button>
      </form>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL DE LA APP -->
  <div id="app-screen" class="hidden max-w-md mx-auto p-4 space-y-6">
    <!-- Header -->
    <header class="flex justify-between items-center pt-2">
      <div>
        <h1 class="text-xl font-bold text-white">Control de Gastos</h1>
        <p id="current-month-label" class="text-xs text-slate-400 capitalize"></p>
      </div>
      <div class="flex gap-2">
        <button id="export-btn" title="Exportar CSV" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700">CSV</button>
        <button id="logout-btn" title="Cerrar sesión" class="bg-slate-800 hover:bg-rose-950 text-rose-400 text-xs px-3 py-1.5 rounded-lg border border-slate-700">Salir</button>
      </div>
    </header>

    <!-- Tarjeta de Balance del Mes -->
    <section class="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700/60 p-5 rounded-2xl shadow-lg">
      <p class="text-xs text-slate-400 uppercase tracking-wider">Balance del mes</p>
      <h2 id="balance-total" class="text-3xl font-extrabold text-white mt-1">$0.00</h2>
      <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-slate-700/50">
        <div>
          <p class="text-xs text-slate-400">Ingresos</p>
          <p id="ingresos-total" class="text-base font-semibold text-emerald-400">+$0.00</p>
        </div>
        <div>
          <p class="text-xs text-slate-400">Gastos</p>
          <p id="gastos-total" class="text-base font-semibold text-rose-400">-$0.00</p>
        </div>
      </div>
    </section>

    <!-- Formulario Rápido -->
    <section class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <form id="tx-form" class="space-y-3">
        <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl">
          <label class="cursor-pointer">
            <input type="radio" name="tipo" value="gasto" checked class="peer sr-only">
            <div class="text-center text-xs font-semibold py-2 rounded-lg text-slate-400 peer-checked:bg-rose-600 peer-checked:text-white transition">Gasto</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="tipo" value="ingreso" class="peer sr-only">
            <div class="text-center text-xs font-semibold py-2 rounded-lg text-slate-400 peer-checked:bg-emerald-600 peer-checked:text-white transition">Ingreso</div>
          </label>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Monto ($)</label>
            <input type="number" step="0.01" id="monto" placeholder="0.00" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Fecha</label>
            <input type="date" id="fecha" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Categoría</label>
            <select id="categoria" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
              <option value="Comida">Comida</option>
              <option value="Transporte / Gasolina">Transporte / Gasolina</option>
              <option value="Servicios / Casa">Servicios / Casa</option>
              <option value="Salud">Salud</option>
              <option value="Ocio / Hobbies">Ocio / Hobbies</option>
              <option value="Trabajo / Ingreso">Trabajo / Ingreso</option>
              <option value="Otros">Otros</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Nota (opcional)</label>
            <input type="text" id="descripcion" placeholder="Ej. Almuerzo" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <button type="submit" id="save-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition">Guardar Movimiento</button>
      </form>
    </section>

    <!-- Historial Reciente -->
    <section class="space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-semibold text-slate-300">Movimientos del mes</h3>
        <span id="tx-count" class="text-xs text-slate-500">0 registros</span>
      </div>
      <div id="tx-list" class="space-y-2">
        <!-- Los items se insertan con JS -->
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
