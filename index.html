<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Gastos</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2344/2344132.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased pb-24">

  <!-- PANTALLA DE LOGIN / REGISTRO -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-sm shadow-xl">
      <h1 class="text-2xl font-bold text-emerald-400 mb-1">Mis Finanzas</h1>
      <p id="auth-subtitle" class="text-slate-400 text-sm mb-5">Inicia sesión para sincronizar tus datos</p>

      <div class="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-xl mb-5">
        <button type="button" id="tab-login" class="py-1.5 text-xs font-semibold rounded-lg bg-slate-800 text-white transition">Iniciar Sesión</button>
        <button type="button" id="tab-signup" class="py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">Crear Cuenta</button>
      </div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@correo.com" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Contraseña (mín. 6 caracteres)</label>
          <input type="password" id="password" minlength="6" placeholder="••••••" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
        </div>
        <div id="auth-feedback" class="text-xs hidden p-2.5 rounded-lg"></div>
        <button type="submit" id="auth-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition">Entrar</button>
      </form>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL DE LA APP -->
  <div id="app-screen" class="hidden max-w-md mx-auto p-4 space-y-5">
    <!-- Header Responsivo -->
    <header class="space-y-2.5 pt-1">
      <!-- Fila 1: Selector de Espacio y Botón Familia -->
      <div class="flex items-center gap-2">
        <select id="workspace-select" class="flex-1 min-w-0 truncate bg-slate-900 border border-indigo-500/40 text-indigo-300 font-bold text-sm rounded-xl px-3 py-2 focus:outline-none">
          <option value="PERSONAL">👤 Fondo Personal</option>
        </select>
        <button id="open-group-modal" title="Crear o unirse a grupo familiar" class="shrink-0 whitespace-nowrap bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-500/40 text-xs font-semibold px-3 py-2 rounded-xl transition">
          + Familia
        </button>
      </div>

      <!-- Fila 2: Filtro de Mes y Botones de Herramientas -->
      <div
